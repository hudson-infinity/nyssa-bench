[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nyssa-bench"
dynamic = ["version"]
description = "Failure-aware evaluation and audit framework for embodied AI policies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hudson Labs" }]
maintainers = [{ name = "Hudson Labs" }]
keywords = ["robotics", "benchmark", "embodied-ai", "evaluation", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/hudson-infinity/nyssa-bench"
Documentation = "https://github.com/hudson-infinity/nyssa-bench/tree/main/docs"
Repository = "https://github.com/hudson-infinity/nyssa-bench"
Issues = "https://github.com/hudson-infinity/nyssa-bench/issues"
Changelog = "https://github.com/hudson-infinity/nyssa-bench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = []
dataset = [
  "h5py>=3.10",
  "pandas>=2.1",
  "pyarrow>=14.0",
]
reports = [
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "plotly>=5.20",
]
video = [
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]
dev = [
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "mypy>=1.8",
  "pre-commit>=3.6",
  "pytest>=8.0",
  "ruff>=0.4",
  "tomli>=2.0; python_version < '3.11'",
  "types-PyYAML>=6.0",
]
maniskill = [
  "numpy>=1.26,<2.0",
  "gymnasium>=0.29",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "mani-skill>=3.0",
]
mujoco = [
  "gymnasium>=0.29",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "mujoco>=3.0",
]
lerobot = [
  "lerobot>=0.1.0",
]
robomimic = [
  "robomimic>=0.3.0",
]
robocasa = [
]
vla = [
  "accelerate>=0.30",
  "pillow>=10.0",
  "safetensors>=0.4",
  "timm>=0.9",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
]
diffusion = [
  "diffusers>=0.27",
  "einops>=0.7",
  "torch>=2.2",
  "torchvision>=0.17",
]
experimental = [
  "genesis-world>=0.2.0",
]
all = [
  "accelerate>=0.30",
  "diffusers>=0.27",
  "einops>=0.7",
  "gymnasium>=0.29",
  "h5py>=3.10",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "jinja2>=3.1",
  "lerobot>=0.1.0",
  "mani-skill>=3.0",
  "matplotlib>=3.8",
  "mujoco>=3.0",
  "numpy>=1.26,<2.0",
  "pandas>=2.1",
  "pillow>=10.0",
  "plotly>=5.20",
  "pyarrow>=14.0",
  "robomimic>=0.3.0",
  "safetensors>=0.4",
  "timm>=0.9",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
]
full = [
  "accelerate>=0.30",
  "diffusers>=0.27",
  "einops>=0.7",
  "genesis-world>=0.2.0",
  "gymnasium>=0.29",
  "h5py>=3.10",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "jinja2>=3.1",
  "lerobot>=0.1.0",
  "mani-skill>=3.0",
  "matplotlib>=3.8",
  "mujoco>=3.0",
  "pandas>=2.1",
  "pillow>=10.0",
  "plotly>=5.20",
  "pyarrow>=14.0",
  "robomimic>=0.3.0",
  "safetensors>=0.4",
  "timm>=0.9",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.40",
]

[project.scripts]
nyssa = "nyssa_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nyssa_bench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "nyssa_bench/version.py"

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"
"conformance" = "conformance"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
