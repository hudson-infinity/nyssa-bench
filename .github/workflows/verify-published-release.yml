name: Verify published release

on:
  workflow_call:
    inputs:
      index:
        description: Package index to verify (testpypi or pypi)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Published install (${{ inputs.index }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify registry bytes and install outside the checkout
        env:
          PACKAGE_INDEX: ${{ inputs.index }}
        run: |
          python scripts/verify_published_release.py \
            --index "${PACKAGE_INDEX}" \
            --version "${GITHUB_REF_NAME#v}" \
            --dist-dir dist \
            --out "${RUNNER_TEMP}/nyssa-published-verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: published-${{ inputs.index }}-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/nyssa-published-verification/
          if-no-files-found: warn
          retention-days: 30
