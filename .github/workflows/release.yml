name: Release Python package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build signed distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require a tag reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Validate tag and package version
        run: python scripts/validate_release_version.py --tag "${GITHUB_REF_NAME}"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Validate distribution contents
        run: python scripts/validate_distributions.py dist/* --out distribution-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-validation
          path: distribution-validation.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  installed-smoke:
    name: Installed wheel smoke (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only the built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test outside a source checkout
        working-directory: ${{ runner.temp }}
        run: |
          nyssa --help
          nyssa --version
          nyssa list-suites
          nyssa list-stressors
          python -c "import nyssa_bench; print(nyssa_bench.__version__)"
          python -m nyssa_bench.packaging_smoke --out "${RUNNER_TEMP}/nyssa-installed-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: release-installed-smoke-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/nyssa-installed-smoke/
          if-no-files-found: error

  publish-testpypi:
    name: Publish release candidate to TestPyPI
    if: contains(github.ref_name, 'rc')
    needs: installed-smoke
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nyssa-bench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish stable release to PyPI
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: installed-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nyssa-bench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
