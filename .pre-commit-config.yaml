minimum_pre_commit_version: "3.6.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=no]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: no-result-zips
        name: prevent committing benchmark result archives
        entry: python scripts/validate_no_result_zips.py
        language: system
        files: ^.*\\.zip$
        pass_filenames: true

      - id: validate-nyssa-configs
        name: validate NyssaBench task and suite configs
        entry: python scripts/validate_configs.py
        language: system
        pass_filenames: false
        files: ^(configs/.*\.(yaml|yml)|nyssa_bench/tasks/.*\.(yaml|yml))$

      - id: release-checklist
        name: validate required release files
        entry: python scripts/release_checklist.py
        language: system
        pass_filenames: false

      - id: validate-public-claims
        name: validate public claims against evidence
        entry: python scripts/validate_claim_evidence.py
        language: system
        pass_filenames: false
        files: ^(README\.md|pyproject\.toml|claims/.*\.json|docs/.*\.md|scripts/validate_claim_evidence\.py|nyssa_bench/claims/.*\.py)$

      - id: validate-phase1-credibility
        name: validate the Phase 1 credibility gate
        entry: python scripts/validate_credibility.py
        language: system
        pass_filenames: false
        files: ^(README\.md|claims/.*\.json|docs/.*\.md|scripts/validate_credibility\.py|nyssa_bench/credibility/.*\.py)$

      - id: validate-reference-candidate
        name: validate the generated reference benchmark candidate
        entry: python scripts/generate_reference_candidate.py --check
        language: system
        pass_filenames: false
        files: ^(configs/reference/.*\.json|configs/suites/nyssa_reference_.*\.yaml|nyssa_bench/reference_benchmark/.*\.py|nyssa_bench/tasks/reference/.*\.yaml|nyssa_bench/tasks/tabletop/maniskill_(pick|push|stack)_cube\.yaml|scripts/generate_reference_candidate\.py)$

      - id: validate-policy-track-candidate
        name: validate the generated policy-track candidate
        entry: python scripts/generate_policy_track_candidate.py --check
        language: system
        pass_filenames: false
        files: ^(configs/policy_tracks/.*\.json|docs/policy_tracks\.md|nyssa_bench/policy_tracks/.*\.py|scripts/generate_policy_track_candidate\.py)$

      - id: validate-hardware-study-candidate
        name: validate the generated hardware-study candidate
        entry: python scripts/generate_hardware_study_candidate.py --check
        language: system
        pass_filenames: false
        files: ^(configs/hardware/.*\.json|docs/hardware_calibration\.md|nyssa_bench/hardware_study/.*\.py|scripts/generate_hardware_study_candidate\.py)$

      - id: validate-simulator-ci-baseline
        name: validate the retained simulator CI baseline
        entry: python scripts/validate_simulator_ci_baseline.py
        language: system
        pass_filenames: false
        files: ^(claims/mujoco_ci_baseline\.json|docs/simulator_ci\.md|scripts/validate_simulator_ci_baseline\.py|tests/test_simulator_ci_baseline\.py)$

      - id: validate-release-version
        name: validate package release version
        entry: python scripts/validate_release_version.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|nyssa_bench/version\.py|scripts/validate_release_version\.py|\.github/workflows/release\.yml)$

      - id: pytest
        name: run full pytest suite
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
