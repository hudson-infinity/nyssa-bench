task_id: maniskill_turn_faucet
engine: maniskill
robot: panda_wristcam
scene: maniskill_turn_faucet
description: TurnFaucet environment mapped through the ManiSkill Gymnasium registry.
objects:
  - name: faucet
    type: articulation
success:
  engine_env_ids: {maniskill: TurnFaucet-v1}
  success_info_keys: [success, is_success, success_once]
  obs_mode: state_dict
  control_mode: pd_ee_delta_pose
  render_mode: rgb_array
  max_steps: 250
randomization: {seed: true}
metrics: [success_rate, completion_time, collision_count]
failure_labels: [bad_grasp, joint_limit, unstable_contact, timeout, unknown_failure]
